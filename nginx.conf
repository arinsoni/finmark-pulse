server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;

    # Proxy /api/* → Flask backend
    location /api/ {
        set $backend http://backend:5001;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Proxy /watch/* → read-only AWS watcher.
    # NOTE: proxy_pass with a VARIABLE does NOT auto-strip the /watch/ prefix
    # (only a literal proxy_pass URI does), so we strip it explicitly with a
    # rewrite. The variable is kept so nginx still boots if the watcher DNS
    # isn't resolvable yet. Without the rewrite the watcher gets /watch/status
    # instead of /status → Flask 404.
    location /watch/ {
        set $watcher http://watcher:5055;
        rewrite ^/watch/(.*)$ /$1 break;
        proxy_pass         $watcher;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
